services:
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: ecommerce_db
    ports:
      - "5566:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: